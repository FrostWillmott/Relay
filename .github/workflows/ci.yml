name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - coverage.svg
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy --strict app/ main.py

      - name: Tests
        run: uv run pytest tests/ --cov-report=xml

      - name: Generate coverage badge
        if: >-
          success() &&
          github.ref == 'refs/heads/master' &&
          github.event_name == 'push'
        run: >-
          uvx --from 'genbadge[coverage]'
          genbadge coverage -i coverage.xml -o coverage.svg

      - name: Push coverage badge
        if: >-
          success() &&
          github.ref == 'refs/heads/master' &&
          github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: coverage.svg