[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.111.0",
    "fastapi>=0.138.0",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov=main --cov-report=term-missing --cov-fail-under=70"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "main"]

[tool.coverage.report]
fail_under = 70
show_missing = true
